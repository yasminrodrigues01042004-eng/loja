<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Simples - Produtos Capilares</title>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Loja Simples</h1>
        <p>Cadastro de Produtos Capilares</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastrar Produto</h2>
            <form id="formProduto">
                <label for="nomeProduto">Nome do produto:</label>
                <input type="text" id="nomeProduto" placeholder="Ex: Máscara de Hidratação Dourada" required>

                <label for="precoProduto">Preço (R$):</label>
                <input type="number" id="precoProduto" step="0.01" min="0" placeholder="Ex: 49.90" required>

                <label for="quantidadeProduto">Quantidade em estoque:</label>
                <input type="number" id="quantidadeProduto" min="1" placeholder="Ex: 10" required>

                <button type="submit" id="botaoFormulario">
                    Adicionar Produto
                </button>
            </form>
            <p id="mensagemErro"></p>
        </section>

        <section class="lista">
            <h2>Produtos Cadastrados</h2>
            <div id="contador">Produtos cadastrados: 0</div>
            <p id="listaVazia">Nenhum produto cadastrado no momento.</p>
            <ul id="listaProdutos"></ul>
        </section>
    </main>

    <footer id="batataFooter">
        <p>Especialistas em Cuidados e Beleza Capilar</p>
        <p>© <span>Loja Simples</span> - Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
